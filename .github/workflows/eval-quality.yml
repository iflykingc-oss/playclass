# LLM generation-quality evals
#
# Offline harness checks run in `ci.yml` via `tests/generation-quality` (no keys).
# This workflow runs the *live* LLM-as-judge suites only when a model key is
# configured as a repository secret. It is intentionally non-blocking on PRs
# without secrets so forks still get green CI.

name: Generation Quality Evals

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        default: all
        options:
          - all
          - orchestration
          - outline-language
          - pbl-v2-planner
          - whiteboard
  schedule:
    # Weekly smoke — Mondays 02:00 UTC
    - cron: '0 2 * * 1'
  pull_request:
    paths:
      - 'packages/@openmaic/generation/**'
      - 'lib/server/classroom-*.ts'
      - 'eval/**'
      - 'skills/agent-runtime/**'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline quality gate (no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality contracts & eval harness integrity
        run: pnpm test:quality

  live-evals:
    name: Live LLM evals (${{ matrix.suite }})
    needs: offline-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [orchestration, outline-language, pbl-v2-planner, whiteboard]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve model key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_DIRECTOR_MODEL: ${{ secrets.EVAL_DIRECTOR_MODEL }}
        run: |
          if [ -n "$EVAL_DIRECTOR_MODEL" ]; then
            echo "model=$EVAL_DIRECTOR_MODEL" >> "$GITHUB_OUTPUT"
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "model=openai:gpt-4.1-mini" >> "$GITHUB_OUTPUT"
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "model=anthropic:claude-sonnet-4-5" >> "$GITHUB_OUTPUT"
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=0" >> "$GITHUB_OUTPUT"
            echo "::notice::No model secret configured — skipping live evals."
          fi

      - name: Run suite
        if: steps.key.outputs.has_key == '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_DIRECTOR_MODEL: ${{ steps.key.outputs.model }}
          EVAL_SAMPLES: '3'
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.suite }}" != "" ] && [ "${{ github.event.inputs.suite }}" != "all" ] && [ "${{ github.event.inputs.suite }}" != "${{ matrix.suite }}" ]; then
            echo "Skipping ${{ matrix.suite }} (filtered)"
            exit 0
          fi
          case "${{ matrix.suite }}" in
            orchestration)     pnpm eval:orchestration ;;
            outline-language)  pnpm eval:outline-language ;;
            pbl-v2-planner)    pnpm eval:pbl-v2-planner ;;
            whiteboard)        pnpm eval:whiteboard ;;
          esac

      - name: Upload reports
        if: always() && steps.key.outputs.has_key == '1'
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.suite }}-${{ github.run_id }}
          path: eval/**/results/**
          if-no-files-found: ignore
          retention-days: 14
